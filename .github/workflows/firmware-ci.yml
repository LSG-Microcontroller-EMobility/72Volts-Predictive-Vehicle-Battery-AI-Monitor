name: AVR Firmware CI
on:
  push:
    branches: [develop, 'release/**']
  pull_request:
    branches: [develop, master, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detect-sketch:
    name: Detect AVR sketch
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.sketch.outputs.present }}
    env:
      GPM_SKETCH_PATH: "72Volts-Predictive-Vehicle-Battery-AI-Monitor"
    steps:
      - uses: actions/checkout@v4
      - name: Locate sketch
        id: sketch
        shell: bash
        run: |
          if [[ ! -d "$GPM_SKETCH_PATH" ]]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo "### Compilazione non eseguita: cartella sketch assente" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapfile -t sketches < <(find "$GPM_SKETCH_PATH" -maxdepth 1 -type f -name '*.ino')
          if (( ${#sketches[@]} == 0 )); then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo "### Compilazione non eseguita: nessun file .ino" >> "$GITHUB_STEP_SUMMARY"
          elif (( ${#sketches[@]} > 1 )); then
            echo "Multiple .ino files found in $GPM_SKETCH_PATH" >&2
            exit 1
          else
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
  avr-build:
    name: AVR firmware build
    needs: detect-sketch
    if: needs.detect-sketch.outputs.present == 'true'
    runs-on: ubuntu-latest
    env:
      GPM_SKETCH_PATH: "72Volts-Predictive-Vehicle-Battery-AI-Monitor"
      GPM_FQBN: "arduino:avr:uno"
      GPM_CORE: "arduino:avr"
      GPM_CORE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Report pinned AVR library revisions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          manifest = json.loads(Path(".gpm/avr-libraries.json").read_text(encoding="utf-8"))
          rows = ["### Versioni librerie usate dalla compilazione AVR", "",
                  "| Libreria | Versione |", "| --- | --- |"]
          for source in manifest.get("gitRepositories", []):
              ref = source.get("ref", "")
              url = source["url"]
              if not re.fullmatch(r"[0-9a-fA-F]{40}", ref):
                  raise SystemExit(f"Library {url} must be pinned to a 40-character commit SHA")
              rows.append(f"| `{url}` | `{ref}` |")
              print(f"Git library: {url} @ {ref}")
              print(f"::notice title=AVR library revision::{url} @ {ref}")
          for library in manifest.get("arduinoLibraryManager", []):
              name = library["name"]
              version = library.get("version", "")
              if not version:
                  raise SystemExit(f"Arduino Library Manager dependency {name} has no pinned version")
              rows.append(f"| `{name}` | `{version}` |")
              print(f"Arduino library: {name} @ {version}")
          for source in manifest.get("projectLibraryPaths", []):
              rows.append(f"| `{source['path']}` | Inclusa nel commit del firmware |")
          if len(rows) == 4:
              rows.append("| Nessuna libreria esterna | — |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(rows) + "\n")
          PY
      - name: Install board core
        shell: bash
        run: |
          if [[ -n "$GPM_CORE_URL" ]]; then
            arduino-cli core update-index --additional-urls "$GPM_CORE_URL"
            arduino-cli core install "$GPM_CORE" --additional-urls "$GPM_CORE_URL"
          else
            arduino-cli core update-index
            arduino-cli core install "$GPM_CORE"
          fi
      - name: Generate CI version header
        shell: bash
        run: |
          VERSION=XXXXXXX
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == release/* ]]; then
            VERSION="$(git rev-parse --short=7 HEAD)"
          fi
          printf '#pragma once\n#define GIT_VERSION "%s"\n' "$VERSION" > "$GPM_SKETCH_PATH/GitVersion.generated.h"
      - name: Compile AVR firmware
        run: python3 .gpm/avr-ci.py "$GPM_FQBN" "$GPM_SKETCH_PATH"
